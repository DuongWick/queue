<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đặt lịch xem bói</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&amp;subset=vietnamese&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--card:#fff;--tx:#2b2118;--mu:#7a6a5a;--ac:#8c2f39;--ac2:#b8862f;--bd:#e6dccb;--ok:#2f7a4d}
@media (prefers-color-scheme:dark){:root{--bg:#1c1613;--card:#2a211c;--tx:#f3eadf;--mu:#b5a592;--ac:#e0707a;--ac2:#d9a94e;--bd:#44372e;--ok:#5fc08a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Noto Serif","Times New Roman",Tahoma,serif}
button,input,textarea{font-family:inherit}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:8px 0 4px;color:var(--ac)}
h2{font-size:18px;margin:24px 0 8px}
.sub,.note{color:var(--mu)} .note{font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:10px 0}
.opts{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:#fff;padding:10px 14px}
button.ghost{background:transparent;color:var(--ac)}
button.sm{padding:4px 10px;font-size:14px}
button.opt{text-align:left;padding:16px;background:var(--card);color:var(--tx);border:2px solid var(--bd)}
button.opt:hover{border-color:var(--ac2)}
button.opt b{display:block;color:var(--ac);margin-bottom:4px}
input,textarea{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:4px 0 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;border-radius:99px;padding:2px 10px;border:1px solid var(--ac2);color:var(--ac2)}
.tag.free{border-color:var(--mu);color:var(--mu)} .tag.ok{border-color:var(--ok);color:var(--ok)}
.pos{font-size:28px;font-weight:bold;color:var(--ac);min-width:44px}
.q{display:flex;gap:12px;align-items:flex-start}
.me{border-color:var(--ac2);border-width:2px}
.bank{background:var(--bg);border:1px dashed var(--ac2);border-radius:8px;padding:10px;margin:10px 0;font-size:15px;word-break:break-all}
.bank img{display:block;max-width:240px;width:100%;margin:8px auto;border-radius:8px;background:#fff}
.err{color:var(--ac);font-size:14px}
.hide{display:none}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-weight:normal;font-size:13px}
tr:last-child td{border-bottom:0}
tr.mine td{background:rgba(184,134,47,.15);font-weight:bold}
.warn{font-style:italic;text-align:right;font-size:13px;color:var(--mu);margin:0 0 12px}
footer{margin-top:40px;text-align:center}
</style>
</head>
<body>
<main id="app">
<h1>🔮 Đặt lịch xem bói</h1>
<p class="sub"><i><u>Không nhận xem cho người dưới 16 tuổi, người theo Thiên chúa giáo.</u></i></p>
<div id="status" class="note">Đang kết nối…</div>

<section id="choose" class="hide">
  <div class="opts">
    <button class="opt" data-mode="donate"><b>💛 Xem trả phí</b>Dành cho người chơi hệ lắm polyme, sẽ được ưu tiên xem trước !!!</button>
    <button class="opt" data-mode="free"><b>🌿 Xem miễn phí</b>Dành cho người chơi hệ kiên nhẫn, xếp sau khách hàng đã trả phí </button>
  </div>
</section>

<section id="form" class="hide card">
  <div class="row"><b id="formTitle"></b><button class="ghost sm" id="back">← Quay lại</button></div>
  <label>Tên (hoặc biệt danh)<input id="name" maxlength="60"></label>
  <label>Năm sinh dương lịch<input id="year" type="number" inputmode="numeric" min="1900" max="2100" placeholder="VD: 1995"></label>
  <label>Tôn giáo hiện tại đang theo<input id="religion" list="religions" maxlength="40" placeholder="Phật giáo, Thiên chúa giáo, Hồi giáo,...">
    <datalist id="religions"><option value="Phật giáo"><option value="Thiên chúa giáo"><option value="Tin lành"><option value="Hồi giáo"><option value="Ấn Độ giáo"><option value="Đạo Cao Đài"><option value="Phật giáo Hòa Hảo"><option value="Thờ cúng tổ tiên"><option value="Không theo tôn giáo"></datalist></label>
  <label>Câu hỏi<textarea id="ask" rows="3" maxlength="500"></textarea></label>
  <div id="err" class="err"></div>
  <button id="submit">Gửi vào hàng đợi</button>
</section>

<section id="mine" class="hide"></section>
<section id="custQueue" class="hide"></section>

<div id="ownerView" class="hide">
  <h2>Hàng đợi hiện tại <span id="count" class="note"></span></h2>
  <div id="queue"></div>
  <div id="pendingWrap" class="hide"><h2>Chờ chuyển khoản</h2><div id="pending"></div></div>
</div>

<footer>
  <button class="ghost sm" id="login">Login (only for administrator !!! )</button>
  <button class="ghost sm hide" id="logout">Đăng xuất</button>
</footer>
</main>
<div id="nf" class="hide" style="text-align:center;padding:20vh 16px;font-family:Arial,sans-serif"><h1 style="font-size:56px;margin:0">404</h1><p class="note">Not Found</p><button class="ghost sm hide" id="login2">Login</button></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ================== CẤU HÌNH ==================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCKG4q7KJsJLGSkZOtwzP6DZZS5fFxbHzU",
  authDomain: "queue-c472c.firebaseapp.com",
  projectId: "queue-c472c",
  appId: "1:90693929755:web:17cf5faf37d5e40ca1a1be"
};
const OWNER_EMAIL = "laptop160306@gmail.com"; // chỉ email này được xác nhận CK / bấm "Xong"
const BANK = { code: "MB", name: "MB Bank", number: "5346974980006", holder: "DUONG VAN TUYEN", amount: "Tùy tâm" };
// ===============================================

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth(), db = firebase.firestore();
const p2 = n => String(n).padStart(2, "0");
const fmt = ts => { if (!ts) return ""; const d = new Date(ts); return `lúc ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}, ngày ${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`; };
const toLocalInput = ts => new Date(ts - new Date(ts).getTimezoneOffset() * 60000).toISOString().slice(0, 19);
const tsDraft = {};
let uid = null, isOwner = false, mode = null, queueDocs = {}, ticketDocs = {}, unsubTickets = null;

function render() {
  const list = Object.entries(queueDocs).map(([id, t]) => ({ id, ...t })).filter(t => !t.done);
  const donors = list.filter(t => t.mode === "donate" && t.paidAt).sort((a, b) => a.paidAt - b.paidAt);
  const free = list.filter(t => t.mode === "free").sort((a, b) => a.createdAt - b.createdAt);
  const pending = list.filter(t => t.mode === "donate" && !t.paidAt).sort((a, b) => a.createdAt - b.createdAt);
  const q = [...donors, ...free];

  // Danh sách đầy đủ + "Chờ chuyển khoản": chỉ chủ trang thấy
  $("#ownerView").classList.toggle("hide", !isOwner);
  $("#count").textContent = q.length ? `(${q.length} khách)` : "";
  $("#queue").innerHTML = q.length ? q.map((t, i) => item(t, i + 1)).join("") : '<div class="card note">Hiện chưa có ai trong hàng đợi.</div>';
  $("#pendingWrap").classList.toggle("hide", !pending.length);
  $("#pending").innerHTML = pending.map(t => item(t, null)).join("");

  // Khách: chỉ thấy vé của chính mình
  const m = list.find(t => t.uid === uid), box = $("#mine");
  if (m && !isOwner) {
    const pos = q.findIndex(t => t.id === m.id) + 1;
    let h = `<div class="card me"><b>Vé của bạn</b><div style="margin:6px 0">${m.mode === "donate" ? '<span class="tag ok">Quẻ trả phí</span>' : '<span class="tag free">Quẻ miễn phí</span>'}</div>Đặt lịch: <b>${fmt(m.createdAt)}</b><br>`;
    if (m.paidAt) h += `Chuyển khoản: <b>${fmt(m.paidAt)}</b><br>`;
    if (pos) h += `Số thứ tự: <span class="pos">#${pos}</span>`;
    else {
      const memo = "BOOK " + m.id;
      const qr = `https://img.vietqr.io/image/${BANK.code}-${BANK.number}-compact2.png?addInfo=${encodeURIComponent(memo)}&accountName=${encodeURIComponent(BANK.holder)}`;
      h += `Đang chờ xác nhận chuyển khoản.<div class="bank"><img src="${qr}" alt="QR chuyển khoản">Ngân hàng: ${esc(BANK.name)}<br>STK: <b>${esc(BANK.number)}</b><br>Chủ TK: ${esc(BANK.holder)}<br>Số tiền: ${esc(BANK.amount)}<br>Nội dung CK: <b>${esc(memo)}</b></div>${m.transferAt ? `<div>Bạn đã báo chuyển khoản <b>${fmt(m.transferAt)}</b>. Vui lòng chờ chủ trang xác nhận.</div>` : `<button id="claim">✅ Tôi đã chuyển khoản</button>`}<div class="note" style="margin-top:8px">Sau khi chủ trang xác nhận, bạn sẽ được xếp vào hàng đợi theo thời điểm chuyển khoản.</div>`;
    }
    if (m.mode === "free") h += `<div style="margin-top:12px"><button id="upgrade">⬆ Chuyển lên quẻ trả phí</button></div>`;
    box.innerHTML = h + `</div>`; box.classList.remove("hide");
    const cq = $("#custQueue");
    cq.innerHTML = `<h2>Hàng đợi hiện tại <span class="note">(${q.length} khách)</span></h2><div class="card" style="padding:0;overflow-x:auto"><table><tr><th>STT</th><th>Tên</th><th>Loại quẻ</th></tr>` +
      (q.length ? q.map((t, i) => `<tr class="${t.id === m.id ? "mine" : ""}"><td>#${i + 1}</td><td>${esc(t.name)}${t.id === m.id ? " (bạn)" : ""}</td><td>${t.mode === "donate" ? "Trả phí" : "Miễn phí"}</td></tr>`).join("") : '<tr><td colspan="3" class="note">Chưa có ai trong hàng đợi.</td></tr>') + `</table></div>`;
    cq.classList.remove("hide");
    $("#choose").classList.add("hide"); $("#form").classList.add("hide");
  } else {
    box.classList.add("hide"); $("#custQueue").classList.add("hide");
    if (!isOwner && $("#form").classList.contains("hide")) $("#choose").classList.remove("hide");
  }
  if (isOwner) { $("#choose").classList.add("hide"); $("#form").classList.add("hide"); }
}

function item(t, pos) {
  const tag = t.mode === "donate" ? (t.paidAt ? '<span class="tag ok">Donate ✓</span>' : '<span class="tag">Donate – chưa CK</span>') : '<span class="tag free">Miễn phí</span>';
  let body = "";
  if (isOwner) {
    let acts = "";
    if (t.mode === "donate" && !t.paidAt) {
      if (!(t.id in tsDraft)) tsDraft[t.id] = toLocalInput(t.transferAt || Date.now());
      acts += `<label class="note">Giờ CK thực tế: <input type="datetime-local" step="1" data-ts="${t.id}" value="${tsDraft[t.id]}" style="width:auto;margin:0"></label><button class="sm" data-pay="${t.id}">Xác nhận đã CK</button> `;
    }
    acts += `<button class="sm ghost" data-done="${t.id}">Đã xem xong</button> <button class="sm ghost" data-del="${t.id}">Xóa</button>`;
    const tk = ticketDocs[t.id] || {};
    const payInfo = t.paidAt ? `Chuyển khoản: <b>${fmt(t.paidAt)}</b>` : (t.transferAt ? `Khách báo đã CK: <b>${fmt(t.transferAt)}</b>` : (t.mode === "donate" ? "Khách chưa báo chuyển khoản" : ""));
    body = `<div class="note" style="margin:4px 0">Đặt lịch: ${fmt(t.createdAt)}${payInfo ? "<br>" + payInfo : ""}</div>` +
      `<div>🎂 Năm sinh: <b>${esc(tk.birthYear)}</b> · 🙏 Tôn giáo: <b>${esc(tk.religion)}</b></div>` +
      `<div style="margin:4px 0">❓ ${esc(tk.ask)}</div><small class="note">Mã: ${esc(t.id)}</small><div class="row" style="margin-top:6px">${acts}</div>`;
  }
  return `<div class="card q ${t.uid === uid ? "me" : ""}">${pos ? `<div class="pos">${pos}</div>` : ""}<div style="flex:1"><div class="row"><b>${esc(t.name)}</b>${tag}</div>${body}</div></div>`;
}

document.addEventListener("input", e => { if (e.target.dataset && e.target.dataset.ts) tsDraft[e.target.dataset.ts] = e.target.value; });
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  try {
    if (b.dataset.mode) { mode = b.dataset.mode; $("#formTitle").textContent = mode === "donate" ? "💛 Đặt lịch donate (ưu tiên)" : "🌿 Xem miễn phí"; $("#choose").classList.add("hide"); $("#form").classList.remove("hide"); }
    else if (b.id === "back") { $("#form").classList.add("hide"); $("#choose").classList.remove("hide"); }
    else if (b.id === "submit") {
      const name = $("#name").value.trim(), ask = $("#ask").value.trim(), religion = $("#religion").value.trim();
      const birthYear = parseInt($("#year").value, 10), thisYear = new Date().getFullYear();
      if (!name || !religion || !ask || !birthYear) { $("#err").textContent = "Vui lòng điền đầy đủ tên, năm sinh, tôn giáo và câu hỏi."; return; }
      if (birthYear < 1900 || birthYear > thisYear) { $("#err").textContent = "Năm sinh không hợp lệ."; return; }
      if (thisYear - birthYear < 16) { await blockMe("under16"); return; }
      if (isChristian(religion)) { await blockMe("christian"); return; }
      $("#err").textContent = "";
      const ref = db.collection("queue").doc();
      await ref.set({ uid, name, mode, createdAt: Date.now(), paidAt: null, done: false });
      await db.collection("tickets").doc(ref.id).set({ uid, ask, birthYear, religion });
      $("#form").classList.add("hide"); ["#ask", "#year", "#religion"].forEach(i => $(i).value = "");
    }
    else if (b.dataset.pay) {
      const id = b.dataset.pay, when = new Date(tsDraft[id]).getTime();
      if (!when) { alert("Giờ chuyển khoản không hợp lệ."); return; }
      await db.collection("queue").doc(id).update({ paidAt: when, confirmedAt: Date.now() });
      delete tsDraft[id];
    }
    else if (b.id === "claim") {
      const mine = Object.entries(queueDocs).find(([id, t]) => t.uid === uid && !t.done);
      if (mine) {
        b.disabled = true;
        try { await db.runTransaction(async tx => { tx.update(db.collection("queue").doc(mine[0]), { transferAt: Date.now() }); }); }
        catch (er) { b.disabled = false; alert("Không ghi nhận được: " + (er.message || er.code)); }
      }
    }
    else if (b.dataset.done) await db.collection("queue").doc(b.dataset.done).update({ done: true });
    else if (b.dataset.del) { const id = b.dataset.del; await db.collection("queue").doc(id).delete(); await db.collection("tickets").doc(id).delete(); }
    else if (b.id === "upgrade") {
      const mine = Object.entries(queueDocs).find(([id, t]) => t.uid === uid && !t.done);
      if (mine && confirm("Chuyển sang quẻ trả phí? Bạn sẽ cần chuyển khoản để được xếp ưu tiên.")) {
        b.disabled = true; b.textContent = "Đang xử lý…";
        try {
          // Dùng transaction: giao diện chỉ đổi sau khi máy chủ xác nhận thành công
          const ref = db.collection("queue").doc(mine[0]);
          await db.runTransaction(async tx => { tx.update(ref, { mode: "donate" }); });
        } catch (er) {
          b.disabled = false; b.textContent = "⬆ Chuyển lên quẻ trả phí";
          alert("Không chuyển được: " + (er.message || er.code) + "\n(Nếu lỗi permissions: chủ trang cần Publish lại firestore.rules mới nhất.)");
        }
      }
    }
    else if (b.id === "login" || b.id === "login2") await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    else if (b.id === "logout") { await auth.signOut(); }
  } catch (err) { $("#err").textContent = "Lỗi: " + (err.message || err.code); console.error(err); }
});

// Nút đăng nhập chỉ hiện khi mở link có đuôi #admin (khách bình thường không thấy)
function updateAdminButtons() {
  const wantAdmin = location.hash === "#admin";
  $("#login").classList.toggle("hide", isOwner || !wantAdmin);
  $("#logout").classList.toggle("hide", !isOwner);
  $("#login2").classList.toggle("hide", isOwner || !wantAdmin);
}
window.addEventListener("hashchange", updateAdminButtons);

// ----- Chặn khách không được nhận (dưới 16 tuổi / theo Thiên chúa giáo): hiện trang 404 -----
const isChristian = r => /thien chua|cong giao|ki-?\s?to|co doc|christian|catholic/.test(
  r.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").toLowerCase());
function showBlocked() {
  $("#nf").classList.remove("hide"); $("#app").classList.add("hide"); document.title = "404 Not Found"; updateAdminButtons();
}
async function blockMe(reason) {
  try { localStorage.setItem("nf", "1"); } catch (e) {}
  try { await db.collection("blocked").doc(uid).set({ at: Date.now(), reason }); } catch (e) {}
  showBlocked();
}
try { if (localStorage.getItem("nf") === "1") showBlocked(); } catch (e) {}

auth.onAuthStateChanged(async u => {
  if (!u) { await auth.signInAnonymously(); return; }
  uid = u.uid;
  isOwner = !!u.email && u.email === OWNER_EMAIL;
  updateAdminButtons();
  if (isOwner) {
    try { localStorage.removeItem("nf"); } catch (e) {}
    $("#nf").classList.add("hide"); $("#app").classList.remove("hide"); document.title = "Đặt lịch xem bói";
  } else {
    let blocked = false;
    try { blocked = localStorage.getItem("nf") === "1"; } catch (e) {}
    try {
      const d = await db.collection("blocked").doc(uid).get();
      if (d.exists) blocked = true;
      else if (blocked) await db.collection("blocked").doc(uid).set({ at: Date.now(), reason: "returning" });
    } catch (e) {}
    if (blocked) { try { localStorage.setItem("nf", "1"); } catch (e) {} showBlocked(); }
  }
  $("#status").classList.add("hide");
  if (unsubTickets) { unsubTickets(); unsubTickets = null; }
  ticketDocs = {};
  if (isOwner) unsubTickets = db.collection("tickets").onSnapshot(s => { ticketDocs = {}; s.docs.forEach(d => ticketDocs[d.id] = d.data()); render(); });
  render();
});
db.collection("queue").onSnapshot(s => { queueDocs = {}; s.docs.forEach(d => queueDocs[d.id] = d.data()); render(); },
  e => { $("#status").classList.remove("hide"); $("#status").textContent = "Không đọc được dữ liệu: " + e.message; });
</script>
</body>
</html>
